<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Семченко І. С., ІМ-42, ЛР-2, Варіант 44</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h2>Лабораторна робота №2</h2>
    </header>

    <main>
      <section class="table-section">
        <h3>Завдання 1. Таблиця HTML5 (Варіант 5)</h3>
        <table class="custom-table">
          <tr class="row-1">
            <td>Семченко</td>
            <td colspan="2">Ілля</td>
            <td>Сергійович</td>
          </tr>

          <tr class="row-mid-1">
            <td rowspan="2"></td>
            <td rowspan="2"></td>
            <td></td>
            <td rowspan="2"></td>
          </tr>
          <tr class="row-mid-2">
            <td></td>
          </tr>

          <tr class="row-3">
            <td>ІМ-42</td>
            <td colspan="2">ЛР №2</td>
            <td>Варіант 44</td>
          </tr>
        </table>
      </section>

      <section class="art-section">
        <h3>Завдання 2. Зображення (Варіант 5: position та transform)</h3>
        <div class="art-container">
          <div class="canvas-box">
            <div class="canvas">
              <div class="circle circle-top-pos"></div>
              <div class="circle circle-left-pos"></div>
              <div class="circle circle-right-pos"></div>
            </div>
          </div>

          <div class="canvas-box">
            <div class="canvas">
              <div class="circle circle-top-tf"></div>
              <div class="circle circle-left-tf"></div>
              <div class="circle circle-right-tf"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
